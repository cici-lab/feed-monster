<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 暗红色肉块渐变 -->
    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#a52525"/>
      <stop offset="50%" style="stop-color:#7a1818"/>
      <stop offset="100%" style="stop-color:#4a0a0a"/>
    </radialGradient>
    <!-- 血肉纹理 -->
    <filter id="flesh">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- 阴影 -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#200000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- 地面阴影 -->
  <ellipse cx="100" cy="175" rx="55" ry="10" fill="#1a0505" opacity="0.4"/>
  
  <!-- 身体主体 - 不规则肉块 -->
  <path d="M 50 120 
           Q 30 80 60 50 
           Q 90 20 130 40 
           Q 170 50 160 90 
           Q 175 130 150 150 
           Q 130 170 100 165 
           Q 60 170 50 140 
           Z" 
        fill="url(#bodyGrad)" 
        filter="url(#shadow)"/>
  
  <!-- 身体纹理 - 暗斑 -->
  <ellipse cx="70" cy="90" rx="20" ry="15" fill="#3a0808" opacity="0.4"/>
  <ellipse cx="130" cy="100" rx="15" ry="12" fill="#3a0808" opacity="0.3"/>
  <ellipse cx="90" cy="130" rx="18" ry="10" fill="#3a0808" opacity="0.35"/>
  
  <!-- 血管纹理 -->
  <path d="M 55 100 Q 65 80 75 95 Q 85 110 80 125" 
        fill="none" stroke="#6a3030" stroke-width="2" opacity="0.5"/>
  <path d="M 140 85 Q 145 100 140 115 Q 135 130 145 140" 
        fill="none" stroke="#6a3030" stroke-width="2" opacity="0.4"/>
  
  <!-- 身体高光 -->
  <ellipse cx="80" cy="55" rx="20" ry="15" fill="#c04040" opacity="0.2"/>
</svg>