<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="eyeGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#a52525"/>
      <stop offset="100%" style="stop-color:#4a0a0a"/>
    </radialGradient>
    <radialGradient id="scleraGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0d0d0"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#ff5050"/>
      <stop offset="50%" style="stop-color:#cc2020"/>
      <stop offset="100%" style="stop-color:#881010"/>
    </radialGradient>
  </defs>
  
  <!-- 简化的肉块身体 -->
  <ellipse cx="50" cy="55" rx="35" ry="30" fill="url(#eyeGrad)"/>
  
  <!-- 核心大眼 -->
  <circle cx="50" cy="40" r="28" fill="url(#scleraGrad)"/>
  <circle cx="50" cy="40" r="28" fill="none" stroke="#802020" stroke-width="2"/>
  
  <!-- 血丝 -->
  <g stroke="#aa4040" stroke-width="0.8" opacity="0.4" fill="none">
    <path d="M 25 35 Q 35 33 42 38"/>
    <path d="M 58 28 Q 62 35 70 35"/>
    <path d="M 35 50 Q 40 48 45 50"/>
  </g>
  
  <!-- 虹膜 -->
  <circle cx="51" cy="39" r="15" fill="url(#irisGrad)"/>
  
  <!-- 瞳孔 -->
  <circle cx="52" cy="38" r="7" fill="#100808"/>
  
  <!-- 高光 -->
  <circle cx="57" cy="32" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="47" cy="44" r="2.5" fill="#ffffff" opacity="0.6"/>
  
  <!-- 小触手 -->
  <ellipse cx="30" cy="78" rx="8" ry="12" fill="#6a1818" transform="rotate(-15 30 78)"/>
  <ellipse cx="70" cy="78" rx="8" ry="12" fill="#6a1818" transform="rotate(15 70 78)"/>
</svg>
