<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 50" width="60" height="50">
  <defs>
    <linearGradient id="mouthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#401010"/>
      <stop offset="100%" style="stop-color:#200505"/>
    </linearGradient>
  </defs>
  
  <!-- 张开的嘴 - 内部黑暗 -->
  <path d="M 5 10 Q 15 5 30 8 Q 45 5 55 10 L 50 40 Q 30 50 10 40 Z" 
        fill="url(#mouthGrad)"/>
  
  <!-- 上唇 -->
  <path d="M 5 10 Q 15 5 30 8 Q 45 5 55 10" 
        fill="none" stroke="#802020" stroke-width="2"/>
  
  <!-- 下唇 -->
  <path d="M 10 40 Q 30 50 50 40" 
        fill="none" stroke="#802020" stroke-width="2"/>
  
  <!-- 尖牙 - 上排 -->
  <polygon points="15,12 12,22 18,22" fill="#f8f8e8"/>
  <polygon points="25,10 22,20 28,20" fill="#f8f8e8"/>
  <polygon points="35,10 32,20 38,20" fill="#f8f8e8"/>
  <polygon points="45,12 42,22 48,22" fill="#f8f8e8"/>
  
  <!-- 尖牙 - 下排 -->
  <polygon points="20,38 17,30 23,30" fill="#f0f0e0"/>
  <polygon points="30,40 27,32 33,32" fill="#f0f0e0"/>
  <polygon points="40,38 37,30 43,30" fill="#f0f0e0"/>
  
  <!-- 舌头 -->
  <ellipse cx="30" cy="38" rx="10" ry="5" fill="#a03040"/>
  <ellipse cx="30" cy="36" rx="5" ry="3" fill="#c04050" opacity="0.5"/>
</svg>