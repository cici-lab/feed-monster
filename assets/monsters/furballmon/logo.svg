<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="furGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0d0e0"/>
    </radialGradient>
  </defs>
  
  <!-- 毛茸茸身体 - 多个小圆组成毛球效果 -->
  <circle cx="50" cy="50" r="35" fill="url(#furGrad)"/>
  
  <!-- 毛发纹理 -->
  <g fill="#d0c0d0" opacity="0.6">
    <circle cx="25" cy="35" r="8"/>
    <circle cx="75" cy="38" r="7"/>
    <circle cx="30" cy="65" r="7"/>
    <circle cx="70" cy="62" r="8"/>
    <circle cx="50" cy="20" r="6"/>
    <circle cx="40" cy="25" r="5"/>
    <circle cx="60" cy="22" r="5"/>
  </g>
  
  <!-- 呆毛 -->
  <path d="M 35 20 Q 30 8 38 5 Q 42 10 38 18" fill="#f0e0f0"/>
  <path d="M 65 22 Q 70 10 62 8 Q 58 12 63 20" fill="#f0e0f0"/>
  
  <!-- 大眼睛 -->
  <ellipse cx="38" cy="45" rx="12" ry="14" fill="#ffffff"/>
  <ellipse cx="62" cy="48" rx="9" ry="11" fill="#ffffff"/>
  
  <!-- 瞳孔 -->
  <circle cx="40" cy="44" r="5" fill="#40a050"/>
  <circle cx="41" cy="43" r="2.5" fill="#102010"/>
  <circle cx="63" cy="47" r="4" fill="#40a050"/>
  <circle cx="64" cy="46" r="2" fill="#102010"/>
  
  <!-- 眼睛高光 -->
  <circle cx="43" cy="40" r="2.5" fill="#ffffff"/>
  <circle cx="65" cy="44" r="2" fill="#ffffff"/>
  
  <!-- 小猫嘴 -->
  <path d="M 45 62 Q 50 58 55 62" fill="none" stroke="#c0a0c0" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 小虎牙 -->
  <path d="M 48 62 L 49 66 L 50 62" fill="#f8f0f8"/>
  <path d="M 50 62 L 51 66 L 52 62" fill="#f8f0f8"/>
</svg>
