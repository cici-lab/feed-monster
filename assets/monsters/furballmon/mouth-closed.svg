<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40">
  <defs>
    <!-- 嘴唇渐变 -->
    <linearGradient id="lipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c0d0"/>
      <stop offset="100%" style="stop-color:#d8a0b8"/>
    </linearGradient>
    <!-- 阴影 -->
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  
  <!-- ω 形小猫嘴 - 两个圆润的小弧 -->
  <g fill="none" stroke="url(#lipGrad)" stroke-width="3" stroke-linecap="round">
    <!-- 左边弧 -->
    <path d="M 18 22 Q 22 14 26 22"/>
    <!-- 右边弧 -->
    <path d="M 34 22 Q 38 14 42 22"/>
  </g>
  
  <!-- 中间小连接点 -->
  <circle cx="30" cy="22" r="1.5" fill="#d8a0b8"/>
  
  <!-- 微小的嘴缝阴影 -->
  <g fill="none" stroke="#c090a8" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <path d="M 20 22 Q 22 16 26 22"/>
    <path d="M 34 22 Q 38 16 40 22"/>
  </g>
</svg>