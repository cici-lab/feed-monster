<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <defs>
    <!-- 毛发边缘渐变 -->
    <radialGradient id="furEdgeSmall" cx="50%" cy="50%" r="50%">
      <stop offset="65%" style="stop-color:#f8f0f8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e8d8e8;stop-opacity:0.7"/>
    </radialGradient>
    <!-- 眼白渐变 -->
    <radialGradient id="scleraGradSmall" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f5f0f5"/>
    </radialGradient>
    <!-- 琥珀金色虹膜 -->
    <radialGradient id="irisGradSmall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="40%" style="stop-color:#ffb347"/>
      <stop offset="70%" style="stop-color:#e8941a"/>
      <stop offset="100%" style="stop-color:#cc7a00"/>
    </radialGradient>
    <!-- 眼皮阴影 -->
    <linearGradient id="lidShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d8c8d8;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#d8c8d8;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- 毛发边缘/眼眶 -->
  <circle cx="25" cy="25" r="23" fill="url(#furEdgeSmall)"/>
  
  <!-- 眼白（稍微椭圆，显得眯眼） -->
  <ellipse cx="25" cy="26" rx="16" ry="14" fill="url(#scleraGradSmall)"/>
  <ellipse cx="25" cy="26" rx="16" ry="14" fill="none" stroke="#d8c8d8" stroke-width="1.2"/>
  
  <!-- 虹膜 -->
  <circle cx="26" cy="25" r="10" fill="url(#irisGradSmall)"/>
  
  <!-- 瞳孔 -->
  <circle cx="27" cy="24" r="5" fill="#1a1a1a"/>
  
  <!-- 主高光 -->
  <ellipse cx="30" cy="20" rx="3.5" ry="3" fill="#ffffff" opacity="0.9"/>
  
  <!-- 次高光 -->
  <circle cx="23" cy="28" r="2" fill="#ffffff" opacity="0.6"/>
  
  <!-- 上眼皮阴影（眯眼效果） -->
  <ellipse cx="25" cy="18" rx="17" ry="6" fill="url(#lidShadow)"/>
  
  <!-- 小毛簇 -->
  <g fill="none" stroke="#e8d8e8" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M 12 18 Q 15 13 20 16"/>
    <path d="M 30 16 Q 35 13 38 18"/>
  </g>
</svg>