<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70">
  <defs>
    <radialGradient id="scleraGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e0f0"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#a080ff"/>
      <stop offset="50%" style="stop-color:#7050dd"/>
      <stop offset="100%" style="stop-color:#4030aa"/>
    </radialGradient>
    <radialGradient id="pupilGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#100820"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </radialGradient>
    <!-- 发光 -->
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 眼白 -->
  <circle cx="35" cy="35" r="30" fill="url(#scleraGrad)"/>
  <circle cx="35" cy="35" r="30" fill="none" stroke="#8060a0" stroke-width="2"/>
  
  <!-- 血丝 -->
  <g opacity="0.2" stroke="#a080c0" stroke-width="0.8" fill="none">
    <path d="M 8 30 Q 20 28 30 32"/>
    <path d="M 40 10 Q 38 20 36 28"/>
    <path d="M 55 40 Q 48 38 42 38"/>
  </g>
  
  <!-- 虹膜 -->
  <circle cx="36" cy="34" r="18" fill="url(#irisGrad)" filter="url(#eyeGlow)"/>
  
  <!-- 瞳孔 -->
  <circle cx="37" cy="33" r="9" fill="url(#pupilGrad)"/>
  
  <!-- 高光 -->
  <circle cx="42" cy="26" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="32" cy="40" r="3" fill="#ffffff" opacity="0.6"/>
</svg>
