<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" width="60" height="30">
  <defs>
    <linearGradient id="stitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#705090"/>
      <stop offset="50%" style="stop-color:#503070"/>
      <stop offset="100%" style="stop-color:#705090"/>
    </linearGradient>
  </defs>
  
  <!-- 缝合嘴 - 带交叉缝合线 -->
