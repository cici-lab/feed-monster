  <!-- 缝合线 X 标记 -->
  <g stroke="#9070b0" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M 15 12 L 15 18"/>
    <path d="M 30 12 L 30 18"/>
    <path d="M 45 12 L 45 18"/>
  </g>
</svg>
