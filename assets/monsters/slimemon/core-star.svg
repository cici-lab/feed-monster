<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <!-- 星星核心发光渐变 -->
    <radialGradient id="starCoreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="30%" style="stop-color:#ffe066"/>
      <stop offset="70%" style="stop-color:#ffb020"/>
      <stop offset="100%" style="stop-color:#ff8010"/>
    </radialGradient>
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 外发光圈 -->
  <circle cx="30" cy="30" r="28" fill="#ffcc40" opacity="0.3" filter="url(#glow)"/>
  
  <!-- 星星形状核心 -->
  <polygon points="30,5 35,22 52,22 38,32 44,50 30,40 16,50 22,32 8,22 25,22" 
           fill="url(#starCoreGrad)" filter="url(#glow)"/>
  
  <!-- 中心亮点 -->
  <circle cx="30" cy="28" r="8" fill="#ffffff" opacity="0.9"/>
</svg>
