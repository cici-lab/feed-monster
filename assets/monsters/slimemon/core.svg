<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <!-- 核心发光渐变 -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffff80"/>
      <stop offset="40%" style="stop-color:#ffd040"/>
      <stop offset="70%" style="stop-color:#ffa020"/>
      <stop offset="100%" style="stop-color:#ff6000;stop-opacity:0.8"/>
    </radialGradient>
    <!-- 外发光 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 外发光圈 -->
  <circle cx="30" cy="30" r="25" fill="#ffd040" opacity="0.3" filter="url(#glow)"/>
  
  <!-- 核心 -->
  <circle cx="30" cy="30" r="18" fill="url(#coreGrad)" filter="url(#glow)"/>
  
  <!-- 星芒 -->
  <g fill="#ffffff" opacity="0.8">
    <polygon points="30,8 32,25 28,25" transform="rotate(0,30,30)"/>
    <polygon points="30,8 32,25 28,25" transform="rotate(60,30,30)"/>
    <polygon points="30,8 32,25 28,25" transform="rotate(120,30,30)"/>
    <polygon points="30,8 32,25 28,25" transform="rotate(180,30,30)"/>
    <polygon points="30,8 32,25 28,25" transform="rotate(240,30,30)"/>
    <polygon points="30,8 32,25 28,25" transform="rotate(300,30,30)"/>
  </g>
  
  <!-- 中心亮点 -->
  <circle cx="30" cy="30" r="5" fill="#ffffff" opacity="0.9"/>
</svg>
